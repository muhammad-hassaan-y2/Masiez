[project]
name = "drone-notebooks"
version = "0.1.0"
description = "Prototyping notebook environment for the Masiez drone simulation"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.3.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.9.0",
    "livekit>=1.0.0",
    "livekit-api>=1.0.0",
    "numpy>=2.0.0",
    "pillow>=11.0.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
]

[tool.uv]
package = false
