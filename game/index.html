<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masiez — Autonomous Drone Simulation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      outline: none;
    }
    #error-console {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      max-height: 200px;
      background: rgba(200, 0, 0, 0.85);
      color: white;
      font-family: monospace;
      font-size: 13px;
      padding: 10px;
      border-radius: 6px;
      overflow-y: auto;
      display: none;
      z-index: 99999;
    }
  </style>
</head>
<body>
  <div id="error-console"></div>
  <canvas id="renderCanvas"></canvas>
  <script>
    window.addEventListener('error', function(e) {
      var el = document.getElementById('error-console');
      if (el) {
        el.style.display = 'block';
        el.innerHTML += '<div><b>Error:</b> ' + (e.message || e) + ' (at ' + (e.filename || '') + ':' + (e.lineno || '') + ')</div>';
      }
    });
    window.addEventListener('unhandledrejection', function(e) {
      var el = document.getElementById('error-console');
      if (el) {
        el.style.display = 'block';
        el.innerHTML += '<div><b>Promise Rejection:</b> ' + (e.reason?.stack || e.reason?.message || e.reason) + '</div>';
      }
    });
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
